<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="СравниПлитку">
  <!-- Знак для вкладки. Кольцо лупы на 16px не читается, поэтому от логотипа
       остаётся его смысловая часть — четыре плитки, две из которых меняются.
       Цвета: подложка c-ink, плитки c-accent-light и c-bg (на тёмном
       основной c-accent слишком глухой). -->
  <rect width="64" height="64" rx="12" fill="#1B211D"/>
  <rect x="11" y="11" width="19" height="19" rx="3" fill="#7BC0A3"/>
  <rect x="34" y="11" width="19" height="19" rx="3" fill="#F1F0ED"/>
  <rect x="11" y="34" width="19" height="19" rx="3" fill="#F1F0ED"/>
  <rect x="34" y="34" width="19" height="19" rx="3" fill="#7BC0A3"/>
</svg>
